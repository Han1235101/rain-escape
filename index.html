
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨中逃生 · 无限挑战</title>

<style>
/* =========================
   1. 页面基础样式
   ========================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --text: #334155;
  --muted: #738196;
  --blue: #5b9de8;
  --cyan: #7adce8;
  --panel: rgba(255, 255, 255, 0.88);
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
  overflow: hidden;
  color: var(--text);
  font-family:
    Inter, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(ellipse at 15% 15%, #e7eef5 0%, transparent 42%),
    radial-gradient(ellipse at 85% 85%, #dce8f1 0%, transparent 45%),
    linear-gradient(135deg, #f0f2f5, #dfe5eb);
}

/* =========================
   2. 游戏容器
   保留原来的单画布核心结构
   ========================= */
.game-container {
  position: relative;
  width: min(960px, 100%);
  height: min(640px, calc(100vh - 36px));
  min-height: 360px;
  overflow: hidden;
  isolation: isolate;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 22px;
  background: linear-gradient(160deg, #eef2f6, #e0e7ed);
  box-shadow:
    0 25px 70px rgba(52, 72, 96, 0.16),
    0 4px 12px rgba(52, 72, 96, 0.08);
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* =========================
   3. 顶部信息栏
   ========================= */
.hud {
  position: absolute;
  top: 18px;
  left: 20px;
  right: 20px;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  pointer-events: none;
}

.hud-item {
  min-width: 100px;
  padding: 10px 15px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.78);
  box-shadow: 0 5px 16px rgba(72, 94, 120, 0.07);
  backdrop-filter: blur(12px);
}

.hud-label {
  display: block;
  margin-bottom: 3px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 1px;
}

.hud-value {
  color: #344760;
  font-size: 19px;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
}

.hud-value.highlight {
  color: #398edb;
}

/* =========================
   4. 开始和结束弹窗
   ========================= */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(221, 230, 239, 0.47);
  backdrop-filter: blur(7px);
  opacity: 1;
  visibility: visible;
  transition: opacity 0.3s ease, visibility 0.3s;
}

.overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.panel {
  width: min(410px, 100%);
  padding: 32px 28px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.95);
  border-radius: 24px;
  background: var(--panel);
  box-shadow:
    0 22px 65px rgba(51, 74, 102, 0.17),
    0 3px 10px rgba(51, 74, 102, 0.06);
  transform: translateY(0) scale(1);
  transition: transform 0.35s ease;
}

.overlay.hidden .panel {
  transform: translateY(12px) scale(0.97);
}

.eyebrow {
  display: inline-block;
  margin-bottom: 14px;
  padding: 6px 11px;
  color: #4b91d4;
  background: #e6f3ff;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 1.5px;
}

.panel h1 {
  margin-bottom: 12px;
  color: #2c3e55;
  font-size: clamp(27px, 5vw, 35px);
  font-weight: 800;
  letter-spacing: -1px;
}

.panel p {
  margin: 9px 0;
  color: #718096;
  font-size: 14px;
  line-height: 1.9;
}

.panel .result {
  margin: 20px 0;
  color: #438edb;
  font-size: 24px;
  font-weight: 800;
}

.panel .sub-result {
  margin-top: -12px;
  color: #8190a3;
  font-size: 13px;
}

/* =========================
   5. 按钮与悬浮效果
   ========================= */
button {
  width: 100%;
  margin-top: 20px;
  padding: 14px 18px;
  border: 0;
  border-radius: 13px;
  color: white;
  background: linear-gradient(135deg, #6ba8ed, #508be0);
  box-shadow: 0 8px 18px rgba(77, 143, 221, 0.25);
  font-size: 15px;
  font-weight: 750;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition:
    transform 0.22s ease,
    box-shadow 0.22s ease,
    filter 0.22s ease;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 24px rgba(77, 143, 221, 0.34);
  filter: brightness(1.06);
}

button:active {
  transform: translateY(0) scale(0.985);
}

button:focus-visible {
  outline: 3px solid #9bcfff;
  outline-offset: 4px;
}

.tips {
  position: absolute;
  bottom: 13px;
  left: 0;
  right: 0;
  z-index: 1;
  color: #8190a1;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.5px;
  pointer-events: none;
}

@media (max-width: 520px) {
  body {
    padding: 8px;
  }

  .game-container {
    height: calc(100vh - 16px);
    min-height: 340px;
    border-radius: 16px;
  }

  .hud {
    top: 12px;
    left: 10px;
    right: 10px;
    gap: 6px;
  }

  .hud-item {
    min-width: 0;
    padding: 8px 10px;
  }

  .hud-label {
    font-size: 9px;
  }

  .hud-value {
    font-size: 16px;
  }

  .panel {
    padding: 27px 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<main class="game-container" id="gameContainer">

  <!-- 游戏画布：背景、门、玩家和雨滴均由 Canvas 绘制 -->
  <canvas id="gameCanvas" aria-label="雨中逃生游戏画面"></canvas>

  <!-- 实时游戏信息 -->
  <div class="hud">
    <div class="hud-item">
      <span class="hud-label">CURRENT SCORE</span>
      <span class="hud-value highlight" id="score">0</span>
    </div>

    <div class="hud-item">
      <span class="hud-label">LEVEL</span>
      <span class="hud-value" id="level">01</span>
    </div>

    <div class="hud-item">
      <span class="hud-label">RAIN DROPS</span>
      <span class="hud-value" id="rainCount">0</span>
    </div>
  </div>

  <!-- 开始界面 -->
  <section class="overlay" id="startScreen">
    <div class="panel">
      <span class="eyebrow">ENDLESS SURVIVAL</span>
      <h1>雨中逃生</h1>
      <p>穿过雨幕，找到出口。<br>每前进一步，挑战都会更难。</p>
      <p>
        ← → / A D 移动<br>
        躲避雨滴，抵达右侧的蓝色出口门。
      </p>
      <button id="startButton">开始挑战 →</button>
    </div>
  </section>

  <!-- 游戏结束界面 -->
  <section class="overlay hidden" id="gameOverScreen">
    <div class="panel">
      <span class="eyebrow">GAME OVER</span>
      <h1>雨势太大了</h1>
      <p>别担心，再试一次就好。</p>
      <div class="result" id="finalResult">得分 0</div>
      <p class="sub-result" id="finalLevel">到达关卡：1</p>
      <button id="restartButton">重新开始 ↻</button>
    </div>
  </section>

  <div class="tips">MOVE WITH ← → OR A / D &nbsp; · &nbsp; REACH THE DOOR TO LEVEL UP</div>
</main>

<script>
"use strict";

/* ==========================================
   1. 获取画布和界面元素
   ========================================== */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const container = document.getElementById("gameContainer");

const scoreElement = document.getElementById("score");
const levelElement = document.getElementById("level");
const rainCountElement = document.getElementById("rainCount");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");

/* ==========================================
   2. 游戏配置
   ========================================== */
const CONFIG = {
  playerSize: 28,
  playerSpeed: 310,

  // 玩家加速度：让移动更自然
  playerAcceleration: 1800,

  rainWidth: 5,
  rainHeight: 17,

  baseRainSpeed: 175,
  rainSpeedIncrease: 28,

  // 每关降低生成间隔，增加雨滴数量
  baseSpawnInterval: 0.72,
  minSpawnInterval: 0.13,

  // 每过 4 关，额外增加每批雨滴数量
  extraDropsEveryLevels: 4,

  // 通关过渡时长
  levelTransitionDuration: 0.55
};

/* ==========================================
   3. 游戏状态
   ========================================== */
let W = 0;
let H = 0;

let gameRunning = false;
let animationId = null;
let lastTime = 0;
let spawnTimer = 0;

let score = 0;
let level = 1;

// 通关动画倒计时
let transitionTimer = 0;

// 通关光效动画进度
let levelFlash = 0;

// 键盘状态
const keys = {
  left: false,
  right: false
};

/* ==========================================
   4. 玩家对象
   x 为当前实际位置，targetX 为目标位置
   ========================================== */
const player = {
  x: 30,
  targetX: 30,
  y: 0,
  width: CONFIG.playerSize,
  height: CONFIG.playerSize,
  color: "#67c8f3"
};

// 雨滴数组
let raindrops = [];

/* ==========================================
   5. 调整画布尺寸
   ========================================== */
function resizeCanvas() {
  const rect = container.getBoundingClientRect();
  const oldW = W;

  W = rect.width;
  H = rect.height;

  const dpr = Math.max(1, window.devicePixelRatio || 1);

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  // 画布内部使用 CSS 像素坐标
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  player.y = H - player.height - 34;

  // 窗口变化时，保持玩家在画面内
  if (oldW > 0) {
    const ratio = W / oldW;
    player.x *= ratio;
    player.targetX *= ratio;
  }

  clampPlayer();

  // 调整时清理超出可视区域的雨滴
  raindrops = raindrops.filter(rain =>
    rain.x >= -20 && rain.x <= W + 20
  );

  draw();
}

window.addEventListener("resize", resizeCanvas);

/* ==========================================
   6. 通用辅助函数
   ========================================== */

// 将数字限制在指定区间
function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

// 平滑插值：数值逐渐接近目标
function lerp(current, target, amount) {
  return current + (target - current) * amount;
}

// 确保玩家不能越过左右边界
function clampPlayer() {
  const maxX = Math.max(0, W - player.width);

  player.x = clamp(player.x, 0, maxX);
  player.targetX = clamp(player.targetX, 0, maxX);
}

/* ==========================================
   7. 绘制浅灰渐变背景
   ========================================== */
function drawBackground() {
  const gradient = ctx.createLinearGradient(0, 0, W, H);

  gradient.addColorStop(0, "#edf1f5");
  gradient.addColorStop(0.5, "#e4eaf0");
  gradient.addColorStop(1, "#d8e2eb");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // 背景柔和光斑
  const glow = ctx.createRadialGradient(
    W * 0.3, H * 0.35, 5,
    W * 0.3, H * 0.35, W * 0.65
  );

  glow.addColorStop(0, "rgba(255,255,255,0.55)");
  glow.addColorStop(1, "rgba(255,255,255,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // 远处建筑剪影
  ctx.fillStyle = "rgba(136, 159, 181, 0.13)";

  for (let i = 0; i < 9; i++) {
    const bw = 30 + (i % 3) * 24;
    const bh = 70 + (i % 4) * 24;
    const bx = i * W / 8 - 12;

    ctx.fillRect(bx, H - 75 - bh, bw, bh);

    // 建筑窗户
    ctx.fillStyle = "rgba(255,255,255,0.23)";

    for (let wy = H - 65 - bh; wy < H - 90; wy += 17) {
      ctx.fillRect(bx + 8, wy, 5, 7);
    }

    ctx.fillStyle = "rgba(136, 159, 181, 0.13)";
  }

  // 地面阴影
  const groundY = H - 34;

  const groundGradient = ctx.createLinearGradient(
    0, groundY, 0, H
  );

  groundGradient.addColorStop(0, "#cbd6e0");
  groundGradient.addColorStop(1, "#e0e7ee");

  ctx.fillStyle = groundGradient;
  ctx.fillRect(0, groundY, W, 34);

  ctx.strokeStyle = "rgba(114, 140, 164, 0.42)";
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();

  // 地面细节线
  ctx.strokeStyle = "rgba(255,255,255,0.45)";

  for (let x = 12; x < W; x += 46) {
    ctx.beginPath();
    ctx.moveTo(x, H - 14);
    ctx.lineTo(x + 20, H - 14);
    ctx.stroke();
  }
}

/* ==========================================
   8. 绘制终点门
   ========================================== */
function getDoor() {
  const width = 43;
  const height = 76;

  return {
    x: W - width - 12,
    y: H - 34 - height,
    width,
    height
  };
}

function drawDoor() {
  const door = getDoor();

  // 门的投影
  ctx.save();
  ctx.shadowColor = "rgba(64, 107, 153, 0.24)";
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 5;

  const frameGradient = ctx.createLinearGradient(
    door.x, door.y, door.x + door.width, door.y
  );

  frameGradient.addColorStop(0, "#a8c5df");
  frameGradient.addColorStop(0.5, "#d5e6f5");
  frameGradient.addColorStop(1, "#86add2");

  // 门框
  ctx.fillStyle = frameGradient;
  ctx.fillRect(
    door.x - 4,
    door.y - 4,
    door.width + 8,
    door.height + 4
  );

  ctx.restore();

  // 门板渐变
  const panelGradient = ctx.createLinearGradient(
    door.x, door.y, door.x + door.width, door.y + door.height
  );

  panelGradient.addColorStop(0, "#8cb9e7");
  panelGradient.addColorStop(1, "#548ac5");

  ctx.fillStyle = panelGradient;
  ctx.fillRect(door.x, door.y, door.width, door.height);

  // 门板装饰
  ctx.strokeStyle = "rgba(255,255,255,0.42)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(
    door.x + 5, door.y + 5,
    door.width - 10, door.height - 10
  );

  // 窗户
  const windowGradient = ctx.createLinearGradient(
    door.x, door.y + 8, door.x + 30, door.y + 35
  );

  windowGradient.addColorStop(0, "#effaff");
  windowGradient.addColorStop(1, "#b1e2f5");

  ctx.fillStyle = windowGradient;
  ctx.fillRect(door.x + 11, door.y + 10, 22, 22);

  // 窗户分隔线
  ctx.strokeStyle = "rgba(89,139,182,0.55)";
  ctx.beginPath();
  ctx.moveTo(door.x + 22, door.y + 10);
  ctx.lineTo(door.x + 22, door.y + 32);
  ctx.moveTo(door.x + 11, door.y + 21);
  ctx.lineTo(door.x + 33, door.y + 21);
  ctx.stroke();

  // 门把手
  ctx.save();
  ctx.shadowColor = "rgba(255,224,147,0.8)";
  ctx.shadowBlur = 5;
  ctx.fillStyle = "#ffe3a0";
  ctx.beginPath();
  ctx.arc(door.x + 33, door.y + 49, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 出口文字
  ctx.save();
  ctx.fillStyle = "#5984ae";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("EXIT", door.x + door.width / 2, door.y - 13);
  ctx.restore();
}

/* ==========================================
   9. 绘制玩家
   柔和渐变、阴影和细节装饰
   ========================================== */
function drawPlayer() {
  ctx.save();

  ctx.shadowColor = "rgba(72, 174, 221, 0.35)";
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 4;

  const gradient = ctx.createLinearGradient(
    player.x, player.y,
    player.x + player.width, player.y + player.height
  );

  gradient.addColorStop(0, "#9ceafa");
  gradient.addColorStop(0.5, "#65c9ee");
  gradient.addColorStop(1, "#439bd7");

  // 圆角方块
  roundedRect(
    ctx,
    player.x, player.y,
    player.width, player.height,
    7
  );

  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.restore();

  // 顶部高光
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  roundedRect(
    ctx,
    player.x + 5, player.y + 4,
    player.width - 10, 4,
    2
  );
  ctx.fill();

  // 眼睛
  ctx.fillStyle = "#285776";
  ctx.beginPath();
  ctx.arc(player.x + 9, player.y + 13, 2, 0, Math.PI * 2);
  ctx.arc(player.x + 19, player.y + 13, 2, 0, Math.PI * 2);
  ctx.fill();

  // 微笑
  ctx.strokeStyle = "#285776";
  ctx.lineWidth = 1.7;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(player.x + 9, player.y + 20);
  ctx.quadraticCurveTo(
    player.x + 14, player.y + 25,
    player.x + 19, player.y + 20
  );
  ctx.stroke();
}

/* ==========================================
   10. 圆角矩形工具
   ========================================== */
function roundedRect(ctx, x, y, width, height, radius) {
  const r = Math.min(radius, width / 2, height / 2);

  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + width - r, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + r);
  ctx.lineTo(x + width, y + height - r);
  ctx.quadraticCurveTo(
    x + width, y + height,
    x + width - r, y + height
  );
  ctx.lineTo(x + r, y + height);
  ctx.quadraticCurveTo(
    x, y + height,
    x, y + height - r
  );
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ==========================================
   11. 创建雨滴
   难度随关卡递增
   ========================================== */
function spawnRain() {
  const margin = 8;

  // 关卡越高，速度越快
  const speed =
    CONFIG.baseRainSpeed +
    (level - 1) * CONFIG.rainSpeedIncrease +
    Math.random() * 65;

  raindrops.push({
    x: margin + Math.random() * Math.max(1, W - margin * 2),
    y: -CONFIG.rainHeight - Math.random() * 25,
    speed,
    angle: (Math.random() - 0.5) * 0.25,
    rotationSpeed: (Math.random() - 0.5) * 1.1,
    opacity: 1,
    fadeOut: false,
    color: Math.random() > 0.5 ? "#63b8ef" : "#8dd9f2"
  });
}

/* ==========================================
   12. 绘制雨滴
   旋转、渐变、柔和发光
   ========================================== */
function drawRaindrops() {
  ctx.save();
  ctx.lineCap = "round";

  for (const rain of raindrops) {
    ctx.save();

    // 以雨滴中心作为旋转轴
    const centerY = rain.y + CONFIG.rainHeight / 2;

    ctx.translate(rain.x, centerY);
    ctx.rotate(rain.angle);
    ctx.globalAlpha = rain.opacity;

    ctx.shadowColor = "rgba(71, 171, 232, 0.32)";
    ctx.shadowBlur = 7;

    const gradient = ctx.createLinearGradient(
      -2, -CONFIG.rainHeight / 2,
      3, CONFIG.rainHeight / 2
    );

    gradient.addColorStop(0, "#b4e9ff");
    gradient.addColorStop(0.45, rain.color);
    gradient.addColorStop(1, "#458fd0");

    ctx.strokeStyle = gradient;
    ctx.lineWidth = CONFIG.rainWidth;

    ctx.beginPath();
    ctx.moveTo(0, -CONFIG.rainHeight / 2);
    ctx.lineTo(-3, CONFIG.rainHeight / 2);
    ctx.stroke();

    ctx.restore();
  }

  ctx.restore();
}

/* ==========================================
   13. 通关光效
   通关后柔和淡出
   ========================================== */
function drawLevelFlash() {
  if (levelFlash <= 0) return;

  ctx.save();
  ctx.globalAlpha = levelFlash * 0.35;
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* ==========================================
   14. 绘制整张画面
   ========================================== */
function draw() {
  if (W <= 0 || H <= 0) return;

  drawBackground();
  drawDoor();
  drawRaindrops();
  drawPlayer();
  drawLevelFlash();
}

/* ==========================================
   15. 平滑更新玩家位置
   ========================================== */
function updatePlayer(dt) {
  let direction = 0;

  if (keys.left) direction -= 1;
  if (keys.right) direction += 1;

  // 目标位置按键盘输入持续变化
  player.targetX += direction * CONFIG.playerSpeed * dt;

  // 限制目标位置，避免移动出画布
  player.targetX = clamp(
    player.targetX,
    0,
    Math.max(0, W - player.width)
  );

  // 插值让玩家平滑跟随目标位置
  const smooth = 1 - Math.exp(-CONFIG.playerAcceleration / CONFIG.playerSpeed * dt);

  player.x = lerp(player.x, player.targetX, smooth);

  // 避免无限接近造成的小数误差
  if (Math.abs(player.x - player.targetX) < 0.05) {
    player.x = player.targetX;
  }

  clampPlayer();
}

/* ==========================================
   16. 矩形碰撞检测
   ========================================== */
function isColliding(a, b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

/* ==========================================
   17. 更新雨滴
   包含旋转、下落、消失淡出和碰撞
   ========================================== */
function updateRaindrops(dt) {
  for (let i = raindrops.length - 1; i >= 0; i--) {
    const rain = raindrops[i];

    rain.y += rain.speed * dt;
    rain.angle += rain.rotationSpeed * dt;

    // 雨滴进入画面底部时，逐渐淡出
    const fadeStart = H - 65;

    if (rain.y > fadeStart) {
      rain.opacity = clamp(
        (H + 10 - rain.y) / (H + 10 - fadeStart),
        0,
        1
      );
    }

    // 雨滴完全离开画布后删除
    if (rain.y - CONFIG.rainHeight > H) {
      raindrops.splice(i, 1);
      continue;
    }

    // 透明度很低的雨滴不再参与碰撞
    if (rain.opacity < 0.08) continue;

    // 构造雨滴的碰撞矩形
    const rainBox = {
      x: rain.x - 5,
      y: rain.y - CONFIG.rainHeight / 2,
      width: 8,
      height: CONFIG.rainHeight
    };

    if (isColliding(player, rainBox)) {
      endGame();
      return;
    }
  }
}

/* ==========================================
   18. 生成难度
   每关生成间隔更短，每批雨滴数量递增
   ========================================== */
function getSpawnInterval() {
  return Math.max(
    CONFIG.minSpawnInterval,
    CONFIG.baseSpawnInterval - (level - 1) * 0.035
  );
}

function getDropsPerSpawn() {
  return 1 + Math.floor(
    (level - 1) / CONFIG.extraDropsEveryLevels
  );
}

/* ==========================================
   19. 检测通关
   玩家到达右侧出口即进入下一关
   ========================================== */
function checkDoor() {
  const door = getDoor();

  // 玩家方块与门的区域重叠时视为通关
  if (
    player.x + player.width > door.x + 2 &&
    player.y + player.height > door.y
  ) {
    completeLevel();
  }
}

/* ==========================================
   20. 通关处理
   加分、升关、返回起点并播放淡入淡出效果
   ========================================== */
function completeLevel() {
  if (transitionTimer > 0 || !gameRunning) return;

  score++;
  level++;

  scoreElement.textContent = score;
  levelElement.textContent = String(level).padStart(2, "0");

  // 开启短暂的通关过渡
  transitionTimer = CONFIG.levelTransitionDuration;
  levelFlash = 1;

  // 玩家回到起点
  player.x = 24;
  player.targetX = 24;

  // 清除键盘输入，防止跨关持续移动
  keys.left = false;
  keys.right = false;

  // 不清空现存雨滴，保持游戏连续性
}

/* ==========================================
   21. 游戏主循环
   requestAnimationFrame 保持动画流畅
   ========================================== */
function gameLoop(timestamp) {
  if (!gameRunning) return;

  // 第一帧只记录时间
  const dt = lastTime === 0
    ? 0
    : Math.min((timestamp - lastTime) / 1000, 0.04);

  lastTime = timestamp;

  // 更新通关动画倒计时
  if (transitionTimer > 0) {
    transitionTimer = Math.max(0, transitionTimer - dt);
  }

  // 通关光效逐渐消失
  levelFlash = Math.max(0, levelFlash - dt * 2.5);

  // 通关过渡期间暂时停止玩家移动
  if (transitionTimer <= 0) {
    updatePlayer(dt);
  }

  // 根据当前关卡生成雨滴
  spawnTimer += dt;

  const interval = getSpawnInterval();

  // 每批生成一定数量的雨滴
  while (spawnTimer >= interval) {
    spawnTimer -= interval;

    const batchSize = getDropsPerSpawn();

    for (let i = 0; i < batchSize; i++) {
      spawnRain();
    }
  }

  // 更新雨滴位置和碰撞
  updateRaindrops(dt);

  // 碰撞导致游戏结束时停止本帧
  if (!gameRunning) return;

  // 只有不在通关过渡期间才检测门
  if (transitionTimer <= 0) {
    checkDoor();
  }

  // 更新雨滴数量
  rainCountElement.textContent = raindrops.length;

  // 绘制当前画面
  draw();

  // 请求下一帧
  animationId = requestAnimationFrame(gameLoop);
}

/* ==========================================
   22. 开始或重新开始游戏
   ========================================== */
function startGame() {
  // 取消上一次可能残留的动画循环
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  // 重置游戏状态
  score = 0;
  level = 1;
  lastTime = 0;
  spawnTimer = 0;
  transitionTimer = 0;
  levelFlash = 0;

  raindrops = [];

  player.x = 24;
  player.targetX = 24;
  player.y = H - player.height - 34;

  keys.left = false;
  keys.right = false;

  scoreElement.textContent = "0";
  levelElement.textContent = "01";
  rainCountElement.textContent = "0";

  startScreen.classList.add("hidden");
  gameOverScreen.classList.add("hidden");

  gameRunning = true;

  // 启动游戏循环
  animationId = requestAnimationFrame(gameLoop);
}

/* ==========================================
   23. 游戏结束
   ========================================== */
function endGame() {
  if (!gameRunning) return;

  gameRunning = false;

  keys.left = false;
  keys.right = false;

  document.getElementById("finalResult").textContent =
    "得分 " + score;

  document.getElementById("finalLevel").textContent =
    "成功到达第 " + level + " 关";

  // 停止游戏动画
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  // 先绘制最后一帧，再展示结束界面
  draw();

  gameOverScreen.classList.remove("hidden");
}

/* ==========================================
   24. 键盘控制
   支持方向键和 A / D
   ========================================== */
window.addEventListener("keydown", function(event) {
  const key = event.key.toLowerCase();

  if (
    key === "arrowleft" ||
    key === "arrowright" ||
    key === "a" ||
    key === "d"
  ) {
    event.preventDefault();
  }

  if (key === "arrowleft" || key === "a") {
    keys.left = true;
  }

  if (key === "arrowright" || key === "d") {
    keys.right = true;
  }
});

window.addEventListener("keyup", function(event) {
  const key = event.key.toLowerCase();

  if (key === "arrowleft" || key === "a") {
    keys.left = false;
  }

  if (key === "arrowright" || key === "d") {
    keys.right = false;
  }
});

// 切换窗口或切换标签页时释放按键，避免角色持续移动
window.addEventListener("blur", function() {
  keys.left = false;
  keys.right = false;
});

// 开始与重新开始按钮
startButton.addEventListener("click", startGame);
restartButton.addEventListener("click", startGame);

/* ==========================================
   25. 初始化
   ========================================== */
resizeCanvas();
draw();
</script>

</body>
