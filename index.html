
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨中冒险 · 无限平台跳跃</title>

<style>
/* =========================
   1. 页面与主题样式
   ========================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --ink: #34465d;
  --muted: #78889c;
  --blue: #5b9ce8;
  --cyan: #8ce6f2;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow: hidden;
  font-family: "Segoe UI", "PingFang SC",
    "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 15% 15%, #f5f7fa, transparent 45%),
    radial-gradient(ellipse at 85% 85%, #d8e4ee, transparent 45%),
    linear-gradient(135deg, #e9edf2, #dce4ec);
}

/* 游戏主容器：保留原有 Canvas 框架 */
.game-container {
  position: relative;
  width: min(1000px, 100%);
  height: min(680px, calc(100vh - 32px));
  min-height: 380px;
  overflow: hidden;
  isolation: isolate;
  border: 1px solid #ffffff;
  border-radius: 22px;
  background: #e5edf4;
  box-shadow:
    0 24px 65px #4b627c25,
    0 4px 12px #4b627c12;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* =========================
   2. HUD 信息栏
   ========================= */
.hud {
  position: absolute;
  z-index: 2;
  top: 15px;
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}

.hud-item {
  min-width: 90px;
  padding: 9px 13px;
  border: 1px solid #ffffff;
  border-radius: 12px;
  background: #ffffffd9;
  box-shadow: 0 4px 14px #40566e12;
  backdrop-filter: blur(10px);
}

.hud-label {
  display: block;
  margin-bottom: 3px;
  color: #8290a2;
  font-size: 10px;
  letter-spacing: 1px;
}

.hud-value {
  color: #344b65;
  font-size: 18px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.hud-value.blue {
  color: #428ed9;
}

/* =========================
   3. 开始与结束弹窗
   ========================= */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #dfe7efaa;
  backdrop-filter: blur(8px);
  opacity: 1;
  visibility: visible;
  transition: opacity .3s ease, visibility .3s ease;
}

.overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.panel {
  width: min(420px, 100%);
  padding: 30px 26px;
  text-align: center;
  border: 1px solid #ffffff;
  border-radius: 23px;
  background: #ffffffed;
  box-shadow: 0 20px 60px #344a621f;
  transform: translateY(0) scale(1);
  transition: transform .3s ease;
}

.overlay.hidden .panel {
  transform: translateY(12px) scale(.97);
}

.eyebrow {
  display: inline-block;
  margin-bottom: 13px;
  padding: 6px 12px;
  color: #488fce;
  background: #e9f4ff;
  border-radius: 30px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.5px;
}

.panel h1 {
  margin-bottom: 12px;
  color: #30445e;
  font-size: clamp(27px, 5vw, 36px);
  letter-spacing: -1px;
}

.panel p {
  margin: 9px 0;
  color: #728198;
  font-size: 14px;
  line-height: 1.9;
}

.result {
  margin: 20px 0;
  color: #438fdc;
  font-size: 25px;
  font-weight: 800;
}

.sub-result {
  font-size: 13px !important;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 14px 18px;
  border: 0;
  border-radius: 12px;
  color: white;
  background: linear-gradient(135deg, #78b7f2, #4d8bdf);
  box-shadow: 0 8px 20px #568fdc40;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s, filter .2s;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px #568fdc55;
  filter: brightness(1.05);
}

button:active {
  transform: scale(.985);
}

button:focus-visible {
  outline: 3px solid #a7d4ff;
  outline-offset: 3px;
}

.tips {
  position: absolute;
  bottom: 12px;
  left: 10px;
  right: 10px;
  z-index: 2;
  color: #74869b;
  text-align: center;
  font-size: 11px;
  pointer-events: none;
}

@media (max-width: 540px) {
  body {
    padding: 6px;
  }

  .game-container {
    height: calc(100vh - 12px);
    min-height: 350px;
    border-radius: 15px;
  }

  .hud {
    top: 10px;
    left: 8px;
    right: 8px;
    gap: 5px;
  }

  .hud-item {
    min-width: 0;
    padding: 7px 8px;
  }

  .hud-label {
    font-size: 8px;
    letter-spacing: .3px;
  }

  .hud-value {
    font-size: 15px;
  }

  .panel {
    padding: 25px 19px;
  }

  .tips {
    font-size: 9px;
  }
}
</style>
</head>

<body>

<main class="game-container" id="gameContainer">

  <!-- 游戏主画布：场景、角色、雨滴和平台全部由 Canvas 绘制 -->
  <canvas id="gameCanvas"></canvas>

  <!-- 实时分数和关卡 -->
  <div class="hud">
    <div class="hud-item">
      <span class="hud-label">SCORE / 分数</span>
      <span class="hud-value blue" id="score">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">LEVEL / 关卡</span>
      <span class="hud-value" id="level">01</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">RAIN / 雨滴</span>
      <span class="hud-value" id="rainCount">0</span>
    </div>
  </div>

  <!-- 开始界面 -->
  <section class="overlay" id="startScreen">
    <div class="panel">
      <span class="eyebrow">RAINY PLATFORM ADVENTURE</span>
      <h1>雨中冒险</h1>
      <p>跳过障碍，踩上平台，寻找避雨棚。<br>穿越雨幕，抵达最右侧的出口！</p>
      <p>
        ← → / A D：左右移动<br>
        空格 / ↑ / W：跳跃<br>
        雨棚顶部可以避雨，碰到障碍不会死亡。
      </p>
      <button id="startButton">开始冒险 →</button>
    </div>
  </section>

  <!-- 游戏结束界面 -->
  <section class="overlay hidden" id="gameOverScreen">
    <div class="panel">
      <span class="eyebrow">ADVENTURE PAUSED</span>
      <h1>冒险结束</h1>
      <p>雨滴击中了你，再来一次吧！</p>
      <div class="result" id="finalResult">得分：0</div>
      <p class="sub-result" id="finalLevel">到达关卡：1</p>
      <button id="restartButton">重新开始 ↻</button>
    </div>
  </section>

  <div class="tips">
    ← → 移动　·　SPACE 跳跃　·　站在雨棚下方的平台即可避雨
  </div>

</main>

<script>
"use strict";

/* ==============================================
   1. 获取画布、容器和界面元素
   ============================================== */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const container = document.getElementById("gameContainer");

const scoreElement = document.getElementById("score");
const levelElement = document.getElementById("level");
const rainCountElement = document.getElementById("rainCount");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");

/* ==============================================
   2. 游戏配置
   ============================================== */
const CONFIG = {
  // 玩家尺寸与运动参数
  playerWidth: 28,
  playerHeight: 32,
  moveSpeed: 250,
  jumpSpeed: 490,
  gravity: 1250,

  // 雨滴参数
  rainWidth: 5,
  rainHeight: 17,
  baseRainSpeed: 165,
  rainSpeedIncrease: 22,
  baseSpawnInterval: 0.72,
  minSpawnInterval: 0.15,

  // 每隔几关额外增加一批雨滴
  extraDropsEveryLevels: 3,

  // 玩家掉出世界多远后判定失败
  fallDeathMargin: 160
};

/* ==============================================
   3. 游戏状态与世界数据
   ============================================== */
let W = 0;
let H = 0;

let gameRunning = false;
let animationId = null;
let lastTime = 0;

let score = 0;
let level = 1;
let spawnTimer = 0;

// 世界总宽度大于屏幕宽度，镜头随玩家移动
let worldWidth = 2400;
let cameraX = 0;

// 每关的地形、障碍、雨棚、雨滴
let platforms = [];
let obstacles = [];
let canopies = [];
let raindrops = [];

// 通关过渡
let transitionTimer = 0;
let levelFlash = 0;

// 键盘状态
const keys = {
  left: false,
  right: false
};

/* ==============================================
   4. 玩家对象
   ============================================== */
const player = {
  x: 35,
  y: 0,
  vx: 0,
  vy: 0,
  width: CONFIG.playerWidth,
  height: CONFIG.playerHeight,
  grounded: false,
  color: "#6bc9f0"
};

/* ==============================================
   5. 通用工具函数
   ============================================== */

// 限制数字范围
function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

// 线性插值
function lerp(a, b, t) {
  return a + (b - a) * t;
}

// 矩形碰撞检测：两个矩形是否相交
function intersects(a, b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

// 圆角矩形绘制工具
function roundedRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);

  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ==============================================
   6. 画布尺寸适配
   ============================================== */
function resizeCanvas() {
  const rect = container.getBoundingClientRect();

  W = rect.width;
  H = rect.height;

  const dpr = Math.max(1, window.devicePixelRatio || 1);

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  // 使用 CSS 像素作为绘图坐标
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 调整画布后，重新生成符合当前屏幕高度的关卡
  if (gameRunning) {
    buildLevel();
  } else {
    draw();
  }
}

window.addEventListener("resize", resizeCanvas);

/* ==============================================
   7. 生成每一关的横版地图
   世界坐标不随镜头移动
   ============================================== */
function buildLevel() {
  worldWidth = Math.max(2200, W * 2.5);

  platforms = [];
  obstacles = [];
  canopies = [];
  raindrops = [];

  const groundY = H - 72;

  // 起点与终点之间设置较长的连续地面
  // 平台是可站立表面，不代表致命障碍
  platforms.push({
    x: 0,
    y: groundY,
    width: worldWidth,
    height: 72,
    type: "ground"
  });

  // 关卡平台布局：在固定位置生成高低不同的平台
  const platformSpecs = [
    { x: 250, y: 0.73, w: 125 },
    { x: 455, y: 0.62, w: 130 },
    { x: 720, y: 0.72, w: 150 },
    { x: 970, y: 0.58, w: 140 },
    { x: 1220, y: 0.69, w: 150 },
    { x: 1500, y: 0.56, w: 140 },
    { x: 1760, y: 0.69, w: 155 },
    { x: 2040, y: 0.61, w: 130 }
  ];

  for (const spec of platformSpecs) {
    // 高度使用相对画布尺寸计算
    const py = Math.min(
      groundY - 90,
      Math.max(groundY - 200, H * spec.y)
    );

    platforms.push({
      x: spec.x,
      y: py,
      width: spec.w,
      height: 15,
      type: "platform"
    });
  }

  // 固定障碍物：碰到时阻挡玩家，但不造成死亡
  const obstacleSpecs = [
    { x: 155, w: 32, h: 38 },
    { x: 390, w: 35, h: 45 },
    { x: 640, w: 32, h: 34 },
    { x: 900, w: 38, h: 48 },
    { x: 1150, w: 34, h: 38 },
    { x: 1425, w: 38, h: 45 },
    { x: 1680, w: 32, h: 36 },
    { x: 1970, w: 38, h: 44 }
  ];

  for (const spec of obstacleSpecs) {
    // 障碍物落在地面上
    obstacles.push({
      x: spec.x,
      y: groundY - spec.h,
      width: spec.w,
      height: spec.h
    });
  }

  // 避雨棚：每个雨棚都有一块可以站立的顶部平台
  // 玩家站在顶部时不受雨滴伤害
  const canopySpecs = [
    { x: 510, y: 0.46, w: 115 },
    { x: 1050, y: 0.43, w: 125 },
    { x: 1585, y: 0.45, w: 120 }
  ];

  for (const spec of canopySpecs) {
    const cy = Math.min(
      groundY - 115,
      Math.max(80, H * spec.y)
    );

    canopies.push({
      x: spec.x,
      y: cy,
      width: spec.w,
      height: 13,
      roofHeight: 13
    });

    // 雨棚顶部也属于可站立平台
    platforms.push({
      x: spec.x,
      y: cy,
      width: spec.w,
      height: 13,
      type: "canopy"
    });
  }

  // 终点门保持在世界最右侧
  cameraX = clamp(cameraX, 0, Math.max(0, worldWidth - W));
}

/* ==============================================
   8. 生成雨滴
   雨滴在镜头当前可见区域上方随机出现
   ============================================== */
function spawnRain() {
  const speed =
    CONFIG.baseRainSpeed +
    (level - 1) * CONFIG.rainSpeedIncrease +
    Math.random() * 55;

  // 将屏幕坐标转换为世界坐标
  const x = cameraX + Math.random() * W;

  raindrops.push({
    x,
    y: -25 - Math.random() * 70,
    speed,
    angle: (Math.random() - 0.5) * 0.2,
    rotationSpeed: (Math.random() - 0.5) * 1.1,
    opacity: 1,
    fadeOut: false
  });
}

/* ==============================================
   9. 绘制背景
   ============================================== */
function drawBackground() {
  const bg = ctx.createLinearGradient(0, 0, W, H);

  bg.addColorStop(0, "#f0f3f6");
  bg.addColorStop(0.55, "#e4ebf1");
  bg.addColorStop(1, "#d6e1ea");

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 远处的柔和光斑
  const glow = ctx.createRadialGradient(
    W * 0.25, H * 0.28, 5,
    W * 0.25, H * 0.28, W * 0.65
  );

  glow.addColorStop(0, "#ffffff8c");
  glow.addColorStop(1, "#ffffff00");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // 远景建筑，随镜头缓慢移动产生视差效果
  ctx.save();
  ctx.fillStyle = "#9fb2c525";

  for (let i = -1; i < 10; i++) {
    const baseX = i * 170 - (cameraX * 0.18 % 170);
    const bh = 70 + ((i + 10) % 4) * 23;

    ctx.fillRect(baseX, H - 72 - bh, 90, bh);

    ctx.fillStyle = "#ffffff45";

    for (let wy = H - 85 - bh; wy < H - 100; wy += 19) {
      ctx.fillRect(baseX + 14, wy, 8, 9);
      ctx.fillRect(baseX + 36, wy, 8, 9);
    }

    ctx.fillStyle = "#9fb2c525";
  }

  ctx.restore();

  // 地面
  const groundY = H - 72;

  const ground = ctx.createLinearGradient(0, groundY, 0, H);
  ground.addColorStop(0, "#d0dbe4");
  ground.addColorStop(1, "#e5ebf0");

  ctx.fillStyle = ground;
  ctx.fillRect(0, groundY, W, 72);

  ctx.strokeStyle = "#aebdca";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();

  // 地面纹理
  ctx.strokeStyle = "#ffffff70";
  ctx.lineWidth = 1;

  for (let x = -20; x < W + 30; x += 48) {
    ctx.beginPath();
    ctx.moveTo(x, groundY + 22);
    ctx.lineTo(x + 20, groundY + 22);
    ctx.stroke();
  }
}

/* ==============================================
   10. 绘制平台
   ============================================== */
function drawPlatforms() {
  for (const p of platforms) {
    // 连续地面已在背景中绘制，只绘制高处平台
    if (p.type === "ground") continue;

    ctx.save();

    ctx.shadowColor = "#607d9825";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;

    const gradient = ctx.createLinearGradient(
      p.x, p.y, p.x, p.y + p.height
    );

    if (p.type === "canopy") {
      gradient.addColorStop(0, "#b9e9f1");
      gradient.addColorStop(1, "#72b9cf");
    } else {
      gradient.addColorStop(0, "#a6c7e5");
      gradient.addColorStop(1, "#729ec8");
    }

    roundedRect(ctx, p.x, p.y, p.width, p.height, 5);
    ctx.fillStyle = gradient;
    ctx.fill();

    // 平台上沿高光
    ctx.strokeStyle = "#ffffffb8";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(p.x + 5, p.y + 1);
    ctx.lineTo(p.x + p.width - 5, p.y + 1);
    ctx.stroke();

    ctx.restore();
  }
}

/* ==============================================
   11. 绘制障碍物
   障碍只阻挡移动，不会杀死玩家
   ============================================== */
function drawObstacles() {
  for (const o of obstacles) {
    ctx.save();

    ctx.shadowColor = "#6174892b";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 4;

    const gradient = ctx.createLinearGradient(
      o.x, o.y, o.x + o.width, o.y + o.height
    );

    gradient.addColorStop(0, "#f0cda8");
    gradient.addColorStop(1, "#c99568");

    roundedRect(ctx, o.x, o.y, o.width, o.height, 6);
    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.restore();

    // 障碍物装饰线
    ctx.strokeStyle = "#ffffff70";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(o.x + 7, o.y + 8);
    ctx.lineTo(o.x + o.width - 7, o.y + 8);
    ctx.stroke();
  }
}

/* ==============================================
   12. 绘制避雨棚
   雨棚本身带有独立的遮雨屋顶
   ============================================== */
function drawCanopies() {
  for (const c of canopies) {
    ctx.save();

    // 屋顶投影
    ctx.shadowColor = "#467b922d";
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 4;

    const roof = ctx.createLinearGradient(
      c.x, c.y, c.x, c.y + c.roofHeight
    );

    roof.addColorStop(0, "#d7f6fb");
    roof.addColorStop(1, "#77c6d8");

    roundedRect(
      ctx,
      c.x, c.y - 5,
      c.width, c.roofHeight,
      6
    );

    ctx.fillStyle = roof;
    ctx.fill();

    ctx.restore();

    // 雨棚支柱
    ctx.strokeStyle = "#76a8b9";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(c.x + 10, c.y + 4);
    ctx.lineTo(c.x + 10, c.y + 26);
    ctx.moveTo(c.x + c.width - 10, c.y + 4);
    ctx.lineTo(c.x + c.width - 10, c.y + 26);
    ctx.stroke();

    // 雨棚上沿高光
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(c.x + 8, c.y - 3);
    ctx.lineTo(c.x + c.width - 8, c.y - 3);
    ctx.stroke();
  }
}

/* ==============================================
   13. 绘制终点门
   ============================================== */
function getDoor() {
  const width = 48;
  const height = 82;

  return {
    x: worldWidth - width - 24,
    y: H - 72 - height,
    width,
    height
  };
}

function drawDoor() {
  const d = getDoor();

  ctx.save();

  ctx.shadowColor = "#5c9ee85c";
  ctx.shadowBlur = 17;
  ctx.shadowOffsetY = 3;

  const frame = ctx.createLinearGradient(
    d.x, d.y, d.x + d.width, d.y
  );

  frame.addColorStop(0, "#8db9e4");
  frame.addColorStop(0.5, "#e1f2ff");
  frame.addColorStop(1, "#77a7d7");

  ctx.fillStyle = frame;
  ctx.fillRect(d.x - 5, d.y - 5, d.width + 10, d.height + 5);

  ctx.restore();

  const doorGradient = ctx.createLinearGradient(
    d.x, d.y, d.x + d.width, d.y + d.height
  );

  doorGradient.addColorStop(0, "#92c0ed");
  doorGradient.addColorStop(1, "#4d87c6");

  ctx.fillStyle = doorGradient;
  ctx.fillRect(d.x, d.y, d.width, d.height);

  ctx.strokeStyle = "#ffffff85";
  ctx.lineWidth = 2;
  ctx.strokeRect(d.x + 5, d.y + 5, d.width - 10, d.height - 10);

  // 门上的窗户
  ctx.fillStyle = "#eafaff";
  ctx.fillRect(d.x + 12, d.y + 10, 24, 25);

  ctx.strokeStyle = "#8cbbe0";
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.moveTo(d.x + 24, d.y + 10);
  ctx.lineTo(d.x + 24, d.y + 35);
  ctx.moveTo(d.x + 12, d.y + 22);
  ctx.lineTo(d.x + 36, d.y + 22);
  ctx.stroke();

  // 门把手
  ctx.fillStyle = "#ffe5a5";
  ctx.beginPath();
  ctx.arc(d.x + 36, d.y + 51, 3, 0, Math.PI * 2);
  ctx.fill();

  // 出口标记
  ctx.fillStyle = "#4b80b5";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("EXIT", d.x + d.width / 2, d.y - 14);
  ctx.textAlign = "left";
}

/* ==============================================
   14. 绘制玩家
   ============================================== */
function drawPlayer() {
  ctx.save();

  // 投影
  ctx.shadowColor = "#3e9dcc55";
  ctx.shadowBlur = 13;
  ctx.shadowOffsetY = 4;

  const gradient = ctx.createLinearGradient(
    player.x, player.y,
    player.x + player.width, player.y + player.height
  );

  gradient.addColorStop(0, "#b4f2ff");
  gradient.addColorStop(0.5, "#70d2f0");
  gradient.addColorStop(1, "#419bd6");

  roundedRect(
    ctx,
    player.x, player.y,
    player.width, player.height,
    7
  );

  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.restore();

  // 顶部高光
  ctx.fillStyle = "#ffffff9c";

  roundedRect(
    ctx,
    player.x + 5, player.y + 4,
    player.width - 10, 4, 2
  );

  ctx.fill();

  // 眼睛
  ctx.fillStyle = "#285676";

  ctx.beginPath();
  ctx.arc(player.x + 9, player.y + 13, 2, 0, Math.PI * 2);
  ctx.arc(player.x + 19, player.y + 13, 2, 0, Math.PI * 2);
  ctx.fill();

  // 微笑
  ctx.strokeStyle = "#285676";
  ctx.lineWidth = 1.6;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(player.x + 9, player.y + 20);
  ctx.quadraticCurveTo(
    player.x + 14, player.y + 24,
    player.x + 19, player.y + 20
  );
  ctx.stroke();
}

/* ==============================================
   15. 绘制雨滴
   ============================================== */
function drawRaindrops() {
  ctx.save();
  ctx.lineCap = "round";

  for (const rain of raindrops) {
    // 世界坐标转换成屏幕坐标
    const screenX = rain.x - cameraX;

    // 不绘制远离视口的雨滴
    if (screenX < -30 || screenX > W + 30) continue;

    ctx.save();

    ctx.translate(screenX, rain.y);
    ctx.rotate(rain.angle);
    ctx.globalAlpha = rain.opacity;

    ctx.shadowColor = "#55b8ed65";
    ctx.shadowBlur = 6;

    const gradient = ctx.createLinearGradient(0, -9, 0, 9);
    gradient.addColorStop(0, "#c9f3ff");
    gradient.addColorStop(0.5, "#76c9f2");
    gradient.addColorStop(1, "#4b91d2");

    ctx.strokeStyle = gradient;
    ctx.lineWidth = CONFIG.rainWidth;

    ctx.beginPath();
    ctx.moveTo(0, -CONFIG.rainHeight / 2);
    ctx.lineTo(-3, CONFIG.rainHeight / 2);
    ctx.stroke();

    ctx.restore();
  }

  ctx.restore();
}

/* ==============================================
   16. 绘制通关闪光
   ============================================== */
function drawLevelFlash() {
  if (levelFlash <= 0) return;

  ctx.save();
  ctx.globalAlpha = levelFlash * 0.3;
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* ==============================================
   17. 统一绘制场景
   在绘制世界对象前后切换镜头坐标
   ============================================== */
function draw() {
  if (W <= 0 || H <= 0) return;

  drawBackground();

  // 世界对象需要减去镜头偏移
  ctx.save();
  ctx.translate(-cameraX, 0);

  drawPlatforms();
  drawObstacles();
  drawCanopies();
  drawDoor();

  ctx.restore();

  // 雨滴函数内部会处理世界坐标转屏幕坐标
  drawRaindrops();

  // 玩家也使用世界坐标，因此同样转换镜头
  ctx.save();
  ctx.translate(-cameraX, 0);
  drawPlayer();
  ctx.restore();

  drawLevelFlash();
}

/* ==============================================
   18. 玩家水平碰撞
   障碍物与平台侧面都会阻挡玩家
   ============================================== */
function movePlayerX(dx) {
  if (dx === 0) return;

  const oldX = player.x;
  player.x += dx;

  // 世界边界限制
  player.x = clamp(
    player.x,
    0,
    worldWidth - player.width
  );

  for (const obstacle of obstacles) {
    if (!intersects(player, obstacle)) continue;

    // 根据运动方向将玩家推回障碍边缘
    if (dx > 0) {
      player.x = obstacle.x - player.width;
    } else if (dx < 0) {
      player.x = obstacle.x + obstacle.width;
    }
  }

  // 平台侧面同样阻挡玩家
  // 仅处理从平台侧面穿入的情况
  for (const p of platforms) {
    if (p.type === "ground") continue;
    if (!intersects(player, p)) continue;

    if (dx > 0 && oldX + player.width <= p.x + 1) {
      player.x = p.x - player.width;
    } else if (
      dx < 0 &&
      oldX >= p.x + p.width - 1
    ) {
      player.x = p.x + p.width;
    }
  }

  // 修正数值误差
  player.x = clamp(
    player.x,
    0,
    worldWidth - player.width
  );
}

/* ==============================================
   19. 跳跃与重力
   只有 grounded 为 true 才能起跳
   ============================================== */
function jump() {
  if (!gameRunning || transitionTimer > 0) return;

  // 未落地时不允许再次跳跃，避免无限跳
  if (!player.grounded) return;

  player.vy = -CONFIG.jumpSpeed;
  player.grounded = false;
}

/* ==============================================
   20. 垂直移动与落地检测
   玩家可以落在地面、平台和雨棚顶部
   ============================================== */
function updatePlayerVertical(dt) {
  const oldBottom = player.y + player.height;

  // 重力让玩家逐渐下落
  player.vy += CONFIG.gravity * dt;
  player.y += player.vy * dt;

  player.grounded = false;

  // 只在向下运动时判定落地
  if (player.vy >= 0) {
    const newBottom = player.y + player.height;

    for (const p of platforms) {
      // 玩家必须与平台水平重叠
      const horizontalOverlap =
        player.x + player.width > p.x &&
        player.x < p.x + p.width;

      if (!horizontalOverlap) continue;

      // 从平台上方穿过平台顶面时，落到平台上
      if (
        oldBottom <= p.y + 3 &&
        newBottom >= p.y &&
        player.y < p.y
      ) {
        player.y = p.y - player.height;
        player.vy = 0;
        player.grounded = true;
      }
    }

    // 处理重力步长较大时的平台顶面碰撞
    if (!player.grounded) {
      for (const p of platforms) {
        const horizontalOverlap =
          player.x + player.width > p.x &&
          player.x < p.x + p.width;

        if (!horizontalOverlap) continue;

        if (
          player.y + player.height >= p.y &&
          player.y + player.height <= p.y + p.height + 8 &&
          oldBottom <= p.y + p.height
        ) {
          player.y = p.y - player.height;
          player.vy = 0;
          player.grounded = true;
          break;
        }
      }
    }
  }

  // 玩家掉出世界后结束游戏，避免无限下落
  if (player.y > H + CONFIG.fallDeathMargin) {
    endGame("fall");
  }
}

/* ==============================================
   21. 更新玩家移动
   水平方向允许空中控制
   ============================================== */
function updatePlayer(dt) {
  let direction = 0;

  if (keys.left) direction -= 1;
  if (keys.right) direction += 1;

  const dx = direction * CONFIG.moveSpeed * dt;

  movePlayerX(dx);
  updatePlayerVertical(dt);
}

/* ==============================================
   22. 检查玩家是否处于雨棚保护区域
   只有站在雨棚顶部才获得保护
   ============================================== */
function isUnderCanopy() {
  for (const canopy of canopies) {
    const standingOnTop =
      Math.abs(
        player.y + player.height - canopy.y
      ) < 2;

    const horizontalOverlap =
      player.x + player.width > canopy.x &&
      player.x < canopy.x + canopy.width;

    if (standingOnTop && horizontalOverlap) {
      return true;
    }
  }

  return false;
}

/* ==============================================
   23. 雨滴更新与碰撞检测
   雨棚上的玩家不会被雨滴击中
   ============================================== */
function updateRaindrops(dt) {
  for (let i = raindrops.length - 1; i >= 0; i--) {
    const rain = raindrops[i];

    rain.y += rain.speed * dt;
    rain.angle += rain.rotationSpeed * dt;

    // 雨滴接近画布底部时渐隐
    const fadeStart = H - 25;

    if (rain.y > fadeStart) {
      rain.opacity = clamp(
        (H + 20 - rain.y) / (H + 20 - fadeStart),
        0,
        1
      );
    }

    // 完全离开画布的雨滴直接移除
    if (rain.y - CONFIG.rainHeight > H + 5) {
      raindrops.splice(i, 1);
      continue;
    }

    // 玩家站在雨棚上时受到保护
    if (isUnderCanopy()) continue;

    // 转换成屏幕坐标检测雨滴和玩家
    const rainScreenX = rain.x - cameraX;

    const rainBox = {
      x: rainScreenX - 3,
      y: rain.y - CONFIG.rainHeight / 2,
      width: 7,
      height: CONFIG.rainHeight
    };

    const playerScreen = {
      x: player.x - cameraX,
      y: player.y,
      width: player.width,
      height: player.height
    };

    // 透明雨滴不参与碰撞
    if (rain.opacity > 0.1 && intersects(playerScreen, rainBox)) {
      endGame("rain");
      return;
    }
  }
}

/* ==============================================
   24. 无限关卡与难度递增
   ============================================== */
function getSpawnInterval() {
  return Math.max(
    CONFIG.minSpawnInterval,
    CONFIG.baseSpawnInterval - (level - 1) * 0.035
  );
}

function getDropsPerSpawn() {
  return 1 + Math.floor(
    (level - 1) / CONFIG.extraDropsEveryLevels
  );
}

/* ==============================================
   25. 终点检测
   ============================================== */
function checkDoor() {
  const door = getDoor();

  const nearDoor =
    player.x + player.width >= door.x &&
    player.x <= door.x + door.width;

  const verticallyAligned =
    player.y + player.height >= door.y &&
    player.y < door.y + door.height;

  if (nearDoor && verticallyAligned) {
    completeLevel();
  }
}

/* ==============================================
   26. 通关动画
   分数递增，重置玩家并生成下一关
   ============================================== */
function completeLevel() {
  if (!gameRunning || transitionTimer > 0) return;

  score++;
  level++;

  scoreElement.textContent = score;
  levelElement.textContent = String(level).padStart(2, "0");

  // 通关时短暂播放淡入淡出光效
  transitionTimer = 0.45;
  levelFlash = 1;

  // 生成下一关地形和雨棚
  buildLevel();

  // 玩家回到起点
  player.x = 35;
  player.y = H - 72 - player.height;
  player.vx = 0;
  player.vy = 0;
  player.grounded = true;

  // 重置镜头
  cameraX = 0;

  // 清除按键状态
  keys.left = false;
  keys.right = false;

  // 雨滴数组随新关卡重置
  raindrops = [];
  spawnTimer = 0;
}

/* ==============================================
   27. 镜头跟随玩家
   玩家接近屏幕中间后，镜头向右平滑滚动
   ============================================== */
function updateCamera(dt) {
  const desiredCameraX = clamp(
    player.x - W * 0.38,
    0,
    Math.max(0, worldWidth - W)
  );

  // 使用指数插值实现镜头平滑跟随
  const smoothing = 1 - Math.exp(-5 * dt);

  cameraX = lerp(cameraX, desiredCameraX, smoothing);
}

/* ==============================================
   28. 游戏主循环
   ============================================== */
function gameLoop(timestamp) {
  if (!gameRunning) return;

  // 限制单帧最大时间，避免窗口卡顿造成角色穿透
  const dt = lastTime === 0
    ? 0
    : Math.min((timestamp - lastTime) / 1000, 0.025);

  lastTime = timestamp;

  // 更新过渡动画
  if (transitionTimer > 0) {
    transitionTimer = Math.max(0, transitionTimer - dt);
  }

  levelFlash = Math.max(0, levelFlash - dt * 2.5);

  // 通关过渡期间暂时冻结角色运动
  if (transitionTimer <= 0) {
    updatePlayer(dt);

    // 玩家还在游戏中时检查出口
    if (gameRunning) {
      checkDoor();
    }
  }

  // 更新镜头
  updateCamera(dt);

  // 生成雨滴
  spawnTimer += dt;

  const interval = getSpawnInterval();

  while (spawnTimer >= interval) {
    spawnTimer -= interval;

    const count = getDropsPerSpawn();

    for (let i = 0; i < count; i++) {
      spawnRain();
    }
  }

  // 更新雨滴和碰撞
  updateRaindrops(dt);

  // 若本帧碰撞导致游戏结束，则停止循环
  if (!gameRunning) return;

  rainCountElement.textContent = raindrops.length;

  // 绘制完整场景
  draw();

  animationId = requestAnimationFrame(gameLoop);
}

/* ==============================================
   29. 开始或重新开始游戏
   ============================================== */
function startGame() {
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  // 重置全部游戏状态
  score = 0;
  level = 1;
  lastTime = 0;
  spawnTimer = 0;
  transitionTimer = 0;
  levelFlash = 0;
  cameraX = 0;

  keys.left = false;
  keys.right = false;

  player.x = 35;
  player.y = H - 72 - player.height;
  player.vx = 0;
  player.vy = 0;
  player.grounded = true;

  scoreElement.textContent = "0";
  levelElement.textContent = "01";
  rainCountElement.textContent = "0";

  // 生成第一关
  buildLevel();

  // 隐藏所有弹窗
  startScreen.classList.add("hidden");
  gameOverScreen.classList.add("hidden");

  gameRunning = true;
  draw();

  animationId = requestAnimationFrame(gameLoop);
}

/* ==============================================
   30. 游戏结束
   ============================================== */
function endGame(reason = "rain") {
  if (!gameRunning) return;

  gameRunning = false;

  keys.left = false;
  keys.right = false;

  document.getElementById("finalResult").textContent =
    "得分：" + score;

  document.getElementById("finalLevel").textContent =
    "到达关卡：" + level +
    (reason === "fall" ? " · 掉出了平台" : " · 被雨滴击中");

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  draw();
  gameOverScreen.classList.remove("hidden");
}

/* ==============================================
   31. 键盘事件
   ============================================== */
window.addEventListener("keydown", function(event) {
  const key = event.key.toLowerCase();

  if (
    key === "arrowleft" ||
    key === "arrowright" ||
    key === "arrowup" ||
    key === " " ||
    key === "a" ||
    key === "d" ||
    key === "w"
  ) {
    event.preventDefault();
  }

  if (key === "arrowleft" || key === "a") {
    keys.left = true;
  }

  if (key === "arrowright" || key === "d") {
    keys.right = true;
  }

  // 空格、上方向键或 W 都可以跳跃
  // jump() 内部会检查 grounded，防止无限跳
  if (
    key === " " ||
    key === "arrowup" ||
    key === "w"
  ) {
    // 长按空格不会在空中重复起跳
    if (!event.repeat) {
      jump();
    }
  }
});

window.addEventListener("keyup", function(event) {
  const key = event.key.toLowerCase();

  if (key === "arrowleft" || key === "a") {
    keys.left = false;
  }

  if (key === "arrowright" || key === "d") {
    keys.right = false;
  }
});

// 切换标签页或窗口失焦时，释放全部按键
window.addEventListener("blur", function() {
  keys.left = false;
  keys.right = false;
});

// 按钮事件
startButton.addEventListener("click", startGame);
restartButton.addEventListener("click", startGame);

/* ==============================================
   32. 初始化
   ============================================== */
resizeCanvas();
draw();

</script>
</body>
